<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SentinelVault - Industrial Zero-Knowledge Password Vault{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- High-grade Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="cyber-bg">
    {% block content %}{% endblock %}

    <!-- Global Sound Synthesizer Engine -->
    <script src="{{ url_for('static', filename='js/sound_engine.js') }}"></script>
    <!-- Cryptographic & Security Utilities -->
    <script src="{{ url_for('static', filename='js/crypto_helper.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
